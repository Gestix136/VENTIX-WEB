<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventix — Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0D47A1 0%,#1565C0 40%,#1E88E5 100%);display:flex;align-items:center;justify-content:center;}
.login-wrap{width:100%;max-width:400px;padding:20px;}
.login-card{background:white;border-radius:20px;padding:40px 36px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.logo-area{text-align:center;margin-bottom:28px;}
.logo-circle{width:68px;height:68px;background:linear-gradient(135deg,#0D47A1,#1E88E5);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;}
.logo-circle svg{width:40px;height:40px;}
.logo-name{font-size:26px;font-weight:800;color:#1A1A2E;letter-spacing:.5px;}
.logo-sub{font-size:12px;color:#90A4AE;margin-top:3px;}
.divider{height:1px;background:#EEF2F7;margin:20px 0;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:#78909C;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.form-control{width:100%;padding:12px 14px;border:2px solid #E8EEF4;border-radius:10px;font-size:14px;color:#1A1A2E;transition:all .2s;outline:none;}
.form-control:focus{border-color:#1E88E5;box-shadow:0 0 0 3px rgba(30,136,229,.12);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#0D47A1,#1E88E5);color:white;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;letter-spacing:.3px;}
.btn-login:hover{opacity:.92;transform:translateY(-1px);}
.error-msg{background:#FFEBEE;border:1px solid #FFCDD2;color:#C62828;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.footer-txt{text-align:center;color:#B0BEC5;font-size:11px;margin-top:20px;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-circle">
        <svg viewBox="0 0 100 100" fill="none">
          <text x="50" y="72" text-anchor="middle" font-family="Inter" font-weight="800" font-size="60" fill="white">V</text>
        </svg>
      </div>
      <div class="logo-name">Ventix</div>
      <div class="logo-sub">Sistema de Punto de Venta</div>
    </div>

    <div class="divider"></div>

    {% if error %}
    <div class="error-msg">❌ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" class="form-control"
               placeholder="Ingresa tu usuario" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control"
               placeholder="Ingresa tu contraseña" required>
      </div>
      <button type="submit" class="btn-login">Ingresar →</button>
    </form>
  </div>
  <div class="footer-txt">Ventix POS · v1.0</div>
</div>
</body>
</html>
